# Trivy suppressions. trivy.yaml points the vulnerability scan here (`ignorefile`) and the
# license step passes it as `trivyignores` (see .github/workflows/checks.yml). Every entry
# carries a statement and, for vulnerabilities, an expiry: Trivy drops an entry at 00:00 UTC
# on the expiry date, so the scan fails again from that day; that is the intended review trigger.
vulnerabilities:
    # pyjwt 2.13.0 in the Semgrep lock (.github/semgrep/uv.lock): fixed in 2.14.0, but
    # Semgrep 1.178.0 pins pyjwt~=2.13.0, so the lock cannot take the fix until Semgrep lifts the
    # pin. pyjwt serves Semgrep's login and app-token flows; the CI job runs `semgrep scan` with
    # public rulesets and never verifies a JWT, so the vulnerable code is unreachable here. Bump
    # Semgrep and delete these entries when a release allows pyjwt >= 2.14.0.
    - id: CVE-2026-102268
      paths: ['.github/semgrep/uv.lock']
      expired_at: 2026-11-01
      statement: pyjwt is reachable only through Semgrep login/app-token flows, which `semgrep scan` never uses; Semgrep 1.178.0 pins pyjwt~=2.13.0
    - id: CVE-2026-102266
      paths: ['.github/semgrep/uv.lock']
      expired_at: 2026-11-01
      statement: pyjwt is reachable only through Semgrep login/app-token flows, which `semgrep scan` never uses; Semgrep 1.178.0 pins pyjwt~=2.13.0

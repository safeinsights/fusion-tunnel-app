# Dependabot keeps the SHA-pinned actions in .github/workflows/ current (see the security
# header in checks.yml). Application dependencies are not tracked here, as in management-app:
# they follow
# the manual update cadence plus pnpm's minimumReleaseAge. The Semgrep lock (.github/semgrep/uv.lock) is
# bumped by hand: Semgrep pins its own dependencies tightly, so Dependabot's single-package
# bumps cannot resolve against it. The 7-day cooldown gives a compromised upstream release
# time to be noticed before a bump is proposed.
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          actions-minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'
      labels:
          - 'dependencies'
          - 'github-actions'

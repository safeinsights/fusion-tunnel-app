# SECURITY: this workflow runs on `pull_request`, so it executes PR-controlled code (pnpm
# install scripts, build, tests). The same rules as management-app (OTTER-545) apply:
#
#   1. Every `actions/checkout` sets `persist-credentials: false` so no usable GITHUB_TOKEN is
#      left on disk for a malicious install script or test fixture to read.
#   2. Every job's `permissions:` block is the minimum that job needs.
#   3. Third-party actions are pinned to commit SHAs (version tag in a trailing comment) and
#      Semgrep to a hash-locked uv.lock, so nothing can be repointed underneath
#      us. Dependabot (.github/dependabot.yml) keeps the pins current.
#
# The scanners (Trivy, Semgrep) run in their own jobs, apart from the job that runs pnpm
# install, so PR-supplied code never executes alongside a scanner. Neither scanner needs a
# secret, which is also why they run unchanged on fork and Dependabot PRs.
#
# Exception to rule 2: the `publish` job holds `contents: write` and the Harbor robot
# credentials. That is OTTER-545-safe because it runs ONLY on push to main (it `needs:` every
# other job and is guarded by both the event and `github.ref == 'refs/heads/main'`): trusted,
# post-merge code that a PR or fork can never trigger. It runs no pnpm install and no app or test
# code on the runner (the Dockerfile's build stage runs the lockfile-pinned install inside
# BuildKit, which sees neither the runner environment nor its secrets). The Harbor secrets live
# in the `harbor` GitHub environment, whose deployment-branch policy allows `main` only, so a PR
# that edited the guard out of this file still could not obtain them. See the job for details.
name: Checks
on:
    push:
        branches: [main]
    pull_request:

# A newer PR commit cancels the older run. Push runs get a unique group so they always finish.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        name: Lint, typecheck, test, build
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # The node:22 runtime image's major, rather than whatever lts/* resolves to.
                  node-version: 22
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint
              run: pnpm run lint
            - name: Typecheck
              run: pnpm run typecheck
            - name: Unit Test
              run: pnpm run test
            - name: Test build
              run: pnpm run build
            - name: Build container image
              run: docker build --target runtime -t fusion-tunnel-app:ci .
            # The tunnel writes nothing to disk (memory-only outbox, no temp files); the image must
            # come up and answer /health with a read-only root filesystem and no writable mounts.
            - name: Read-only root filesystem smoke test
              run: |
                  cid=$(docker run -d --read-only -p 3003:3003 \
                      -e FUSION_PROVISION_TOKEN=ci-smoke-provision-token-0123456789 fusion-tunnel-app:ci)
                  ok=0
                  for _ in $(seq 1 30); do
                      if curl -fsS http://localhost:3003/health; then ok=1; break; fi
                      sleep 1
                  done
                  echo
                  docker logs "$cid"
                  docker rm -f "$cid" >/dev/null
                  test "$ok" = 1

    # The compose stacks are the regression bed the real relay and BMA are later swapped into.
    # Kept as a separate job so unit CI stays fast; `run` returns the destination RC's exit code.
    compose-smoke:
        needs: checks
        timeout-minutes: 25
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Two-party stack
              id: two-party
              run: docker compose --profile two-party run --build --rm rc-dst
            # `run` attaches only to rc-dst, so a failure in setup or a tunnel is invisible without
            # the other containers' logs. Dump them before the stack is torn down.
            - name: Two-party stack logs (on failure)
              if: failure() && steps.two-party.outcome == 'failure'
              run: |
                  docker compose --profile two-party ps -a
                  docker compose --profile two-party logs --no-color --timestamps
            - name: Tear down
              if: always()
              run: docker compose --profile two-party down -v --remove-orphans
            - name: Hub stack
              id: hub
              run: docker compose --env-file compose.hub.env --profile hub run --build --rm rc-dst-hub
            - name: Hub stack logs (on failure)
              if: failure() && steps.hub.outcome == 'failure'
              run: |
                  docker compose --env-file compose.hub.env --profile hub ps -a
                  docker compose --env-file compose.hub.env --profile hub logs --no-color --timestamps
            - name: Tear down hub
              if: always()
              run: docker compose --env-file compose.hub.env --profile hub down -v --remove-orphans

    trivy:
        name: Trivy (vulnerabilities, secrets, licenses)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Trivy downloads its binary and vulnerability DB on every run and flakes when an
            # upstream fetch fails. Pinning `version` keeps trivy-action's built-in cache key
            # stable across runs, and one shared `cache-dir` means the DB is fetched at most
            # once per run. A version bump naturally busts the cache.
            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  trivy-config: trivy.yaml
                  version: v0.70.0
                  cache-dir: ${{ github.workspace }}/.cache/trivy
            - name: Run Trivy license scanner
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  scanners: 'license'
                  severity: 'HIGH,CRITICAL'
                  exit-code: '1'
                  trivyignores: '.trivyignore.yaml'
                  version: v0.70.0
                  cache-dir: ${{ github.workspace }}/.cache/trivy

    # SAST with Semgrep Community Edition: public rulesets, no account, no token, so there is
    # nothing here to steal. `--error` fails the job on any finding. Silence a false positive
    # in the source with `// nosemgrep: <rule-id>` plus a one-line reason, never by loosening
    # this command. .semgrepignore lists what is not scanned (tests, test tooling, build output).
    semgrep:
        name: Semgrep SAST
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
            # .github/semgrep is a tiny uv project whose uv.lock pins Semgrep and every transitive
            # dependency with hashes, the uv equivalent of a SHA pin; `--locked` refuses to run if
            # the lock and pyproject disagree. Bumping Semgrep is a by-hand edit of that pyproject
            # plus `uv lock --project .github/semgrep`. Dependabot does not manage this lock.
            - name: Install Semgrep
              run: uv sync --locked --project .github/semgrep
            # p/ci is Semgrep's curated high-confidence set; the language, Dockerfile and GitHub
            # Actions packs add the remaining rules for what this repo contains. The pnpm
            # release-age rule wants a 7-day cooldown, but the org standard is 2 days
            # (minimumReleaseAge: 2880 in every pnpm repo, management-app included), so that
            # rule is excluded here rather than the setting changed.
            - name: Semgrep
              run: >-
                  uv run --locked --project .github/semgrep semgrep scan
                  --config p/ci
                  --config p/typescript
                  --config p/nodejs
                  --config p/dockerfile
                  --config p/github-actions
                  --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
                  --metrics=off --error --text .

    # Advisory only: on a PR that touches runtime-relevant paths without bumping package.json
    # `version`, warn that the merge will publish nothing (the publish job below skips versions
    # Harbor already has). Never fails. Read-only: it compares against the PR base through the
    # GitHub API rather than `git fetch`, which has no credentials after
    # `persist-credentials: false`. A scripts-only or version-only package.json edit does not
    # count as a dependency change.
    version-bump-advisory:
        name: Version bump advisory
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Compare version and dependencies with the PR base
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh api -H 'Accept: application/vnd.github.raw+json' \
                      "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=$BASE_SHA" > "$RUNNER_TEMP/base-package.json"
                  changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER/files" --jq '.[].filename')"
                  relevant="$(printf '%s\n' "$changed" | grep -E '^(src/|Dockerfile$|pnpm-lock\.yaml$)' || true)"
                  deps_changed="$(node -e '
                      const pick = (p) => { const j = require(p); return JSON.stringify([j.dependencies, j.devDependencies]) }
                      console.log(pick(process.env.RUNNER_TEMP + "/base-package.json") !== pick(process.cwd() + "/package.json"))
                  ')"
                  base_version="$(node -p "require(process.env.RUNNER_TEMP + '/base-package.json').version")"
                  head_version="$(node -p "require('./package.json').version")"
                  if [[ ( -n "$relevant" || "$deps_changed" == "true" ) && "$base_version" == "$head_version" ]]; then
                      msg="package.json version is still $head_version but src/, Dockerfile, dependencies or pnpm-lock.yaml changed. Merging will publish no image; bump the version if this should ship."
                      echo "::warning title=Version not bumped::$msg"
                      echo "**Version not bumped:** $msg" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Version: $base_version -> $head_version; relevant changes: ${relevant:-none}; deps changed: $deps_changed" >> "$GITHUB_STEP_SUMMARY"
                  fi

    # SECURITY (OTTER-545): publishes the runtime image to Harbor and cuts the matching GitHub
    # release. This job holds `contents: write` and the Harbor robot credentials, but it is safe
    # because:
    #   - it runs ONLY on push to main: `needs:` every other job, plus the event + ref guard (the
    #     same belt-and-braces as management-app's coverage-baseline job). A PR or fork can never
    #     trigger it; on PR runs the job is skipped, which branch protection counts as success;
    #   - the Harbor secrets live in the `harbor` GitHub environment whose deployment-branch
    #     policy allows `main` only, so even a PR that edits the guard out of this file cannot
    #     obtain them: GitHub refuses the environment for a non-main ref;
    #   - it runs NO `pnpm install` and NO app/test code on the runner. `docker build` runs the
    #     lockfile-pinned install inside BuildKit, which sees neither the runner environment nor
    #     its secrets. The host only runs node -p, curl, docker and gh;
    #   - the credentials are in scope for the `docker login` step alone, and `docker logout`
    #     runs unconditionally so nothing is left in ~/.docker/config.json;
    #   - `contents: write` exists only for `gh release create`; every expression reaches a
    #     script through `env:`, never by interpolation into `run:`.
    # Versioning: the image tag is `version` from package.json, bumped in the PR. If Harbor
    # already has that tag (Dependabot and CI-only merges), the image steps are skipped; the
    # release step is gated separately so a re-run after a partial failure finishes the job
    # instead of skipping it. `latest` only moves when this SHA is still main HEAD, so a re-run
    # of an older run republishes its own version but never regresses `latest`.
    # Do NOT add a `pull_request` trigger, a same-repo-PR gate, or a PR-head checkout here.
    publish:
        name: Publish image to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [checks, compose-smoke, trivy, semgrep]
        # Serialise publishes from concurrent main merges; their test jobs still run in parallel.
        # `queue: max` keeps every queued publish (cancel-in-progress: false would drop an older
        # pending run, and with it a version). management-app's coverage-baseline job uses the
        # same key; actionlint 1.7.x does not know it yet and reports it as unexpected.
        concurrency:
            group: publish-main
            queue: max
        environment: harbor
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            HARBOR_HOST: harbor.safeinsights.org
            IMAGE: harbor.safeinsights.org/safeinsights-public/fusion-tunnel-app
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Read version from package.json
              id: version
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::package.json version '$version' is not MAJOR.MINOR.PATCH"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            # Anonymous read against the public project, so a no-op run never touches a secret.
            # 200 = already published (skip the image steps), 404 = not there yet (also the very
            # first push, when the repository itself does not exist), anything else is an outage
            # that must not be papered over.
            - name: Check whether Harbor already has this version
              id: harbor
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      "https://$HARBOR_HOST/api/v2.0/projects/safeinsights-public/repositories/fusion-tunnel-app/artifacts/$VERSION")"
                  case "$code" in
                      200)
                          echo "image-exists=true" >> "$GITHUB_OUTPUT"
                          echo "$IMAGE:$VERSION already exists; the image steps will be skipped."
                          ;;
                      404)
                          echo "image-exists=false" >> "$GITHUB_OUTPUT"
                          ;;
                      *)
                          echo "::error::Harbor returned HTTP $code for $IMAGE:$VERSION"
                          exit 1
                          ;;
                  esac
            # A tag that already points at a different commit means a version number was reused:
            # a human mistake to surface, not to paper over.
            - name: Check whether the GitHub release exists
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
                      echo "release-exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "release-exists=false" >> "$GITHUB_OUTPUT"
                      tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$VERSION" --jq '.object.sha' 2>/dev/null || true)"
                      if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
                          echo "::error::tag v$VERSION already points at $tag_sha, not $GITHUB_SHA. Bump the version."
                          exit 1
                      fi
                  fi
            - name: Check whether this run is current main HEAD
              id: main-head
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                  if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
                      echo "is-current=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is-current=false" >> "$GITHUB_OUTPUT"
                      echo "$GITHUB_SHA is no longer main HEAD ($head_sha); :latest will not move."
                  fi
            - name: Build runtime image
              if: steps.harbor.outputs.image-exists == 'false'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker build --platform linux/amd64 --target runtime -t "$IMAGE:$VERSION" .
            # The only step that can see the Harbor credentials.
            - name: Log in to Harbor
              if: steps.harbor.outputs.image-exists == 'false'
              env:
                  HARBOR_ROBOT_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
                  HARBOR_ROBOT_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
              run: |
                  if [[ -z "$HARBOR_ROBOT_USERNAME" || -z "$HARBOR_ROBOT_PASSWORD" ]]; then
                      echo "::error::HARBOR_ROBOT_USERNAME / HARBOR_ROBOT_PASSWORD are not set in the 'harbor' environment (see README, Releasing)."
                      exit 1
                  fi
                  echo "$HARBOR_ROBOT_PASSWORD" | docker login "$HARBOR_HOST" --username "$HARBOR_ROBOT_USERNAME" --password-stdin
            - name: Push image
              if: steps.harbor.outputs.image-exists == 'false'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  IS_CURRENT: ${{ steps.main-head.outputs.is-current }}
              run: |
                  docker push "$IMAGE:$VERSION"
                  if [[ "$IS_CURRENT" == "true" ]]; then
                      docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
                      docker push "$IMAGE:latest"
                  else
                      echo "Not main HEAD any more; leaving :latest untouched."
                  fi
            - name: Log out of Harbor
              if: always()
              run: docker logout "$HARBOR_HOST" || true
            - name: Tag and release
              if: steps.release.outputs.release-exists == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
                      --notes "Image: \`$IMAGE:$VERSION\`"
            - name: Summary
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  IMAGE_EXISTS: ${{ steps.harbor.outputs.image-exists }}
                  RELEASE_EXISTS: ${{ steps.release.outputs.release-exists }}
              run: |
                  {
                      echo "### Publish $VERSION"
                      if [[ "$IMAGE_EXISTS" == "true" ]]; then
                          echo "- image: \`$IMAGE:$VERSION\` was already in Harbor, skipped"
                      else
                          echo "- image: pushed \`$IMAGE:$VERSION\`"
                      fi
                      if [[ "$RELEASE_EXISTS" == "true" ]]; then
                          echo "- release: v$VERSION already existed"
                      else
                          echo "- release: created v$VERSION"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

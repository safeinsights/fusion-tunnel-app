# 'table' prints a compact, human-readable summary in CI logs. JSON dumped thousands of
# lines per run and was impossible to scan by eye; nothing downstream consumes the output.
format: table
exit-code: 1
debug: false
timeout: 5m
# The vulnerability scan does not load .trivyignore.yaml by itself; point it there so the
# time-boxed, path-scoped suppressions in that file apply.
ignorefile: .trivyignore.yaml
severity:
    - HIGH
    - CRITICAL
scan:
    scanners:
        - vuln
        - secret
    skip-dirs:
        - .git
        - .husky
        - node_modules
    skip-files:
        - .env
misconfiguration:
    scanners:
        - dockerfile
pkg:
    include-dev-deps: true
